<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="author" content="Devansh Rathore">

    <title>StudyHub - Contact Us</title>

</head>

<body>

    <header>

        <h1 align="center">StudyHub</h1>

        <h2 align="center">Contact Us</h2>

    </header>

    <hr>

    <main>

        <section>

            <h2>Student Information</h2>

            <form>

                <!-- Name -->
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <br><br>

                <!-- Email -->
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <br><br>

                <!-- Contact Number -->
                <label for="contact">Contact Number:</label>
                <input type="tel" id="contact" name="contact" required>

                <br><br>

                <!-- Class -->
                <label>Class:</label>

                <input type="radio" id="class11" name="class" value="11th">
                <label for="class11">11th</label>

                <input type="radio" id="class12" name="class" value="12th">
                <label for="class12">12th</label>

                <input type="radio" id="college" name="class" value="college">
                <label for="college">College</label>

                <br><br>

                <!-- Favourite Subject -->
                <label>Favourite Subject:</label>

                <br>

                <input type="checkbox" id="maths" name="subject" value="mathematics">
                <label for="maths">Mathematics</label>

                <br>

                <input type="checkbox" id="physics" name="subject" value="physics">
                <label for="physics">Physics</label>

                <br>

                <input type="checkbox" id="cs" name="subject" value="computer-science">
                <label for="cs">Computer Science</label>

                <br>

                <input type="checkbox" id="web" name="subject" value="web-development">
                <label for="web">Web Development</label>

                <br><br>

                <!-- State -->
                <label for="state">State:</label>

                <select id="state" name="state" required>

                    <option value="">--Select State--</option>
                    <option value="uttar-pradesh">Uttar Pradesh</option>
                    <option value="delhi">Delhi</option>
                    <option value="haryana">Haryana</option>
                    <option value="rajasthan">Rajasthan</option>
                    <option value="punjab">Punjab</option>
                    <option value="maharashtra">Maharashtra</option>
                    <option value="bihar">Bihar</option>

                </select>

                <br><br>

                <!-- Submit -->
                <input type="submit" value="Submit">

            </form>

        </section>

    </main>

    <hr>

    <footer>

        <p align="center">
            &copy; 2026 StudyHub. All Rights Reserved.
        </p>

        <p align="center">
            Created by Devansh Rathore
        </p>

    </footer>

</body>

</html>
